<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 0px 10px gray;
            text-align: center;
            width: 350px;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            border: none;
            background: black;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        #password {
            margin-top: 20px;
            font-size: 18px;
            color: green;
            word-wrap: break-word;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Password Generator 🔐</h2>

        <input type="number" id="length" placeholder="Enter password length">

        <br>

        <button onclick="generatePassword()">
            Generate Password
        </button>

        <div id="password"></div>
    </div>

    <script>
        function generatePassword() {

            let length = document.getElementById("length").value;

            let characters =
                "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()";

            let password = "";

            for (let i = 0; i < length; i++) {
                password += characters.charAt(
                    Math.floor(Math.random() * characters.length)
                );
            }

            document.getElementById("password").innerHTML =
                "Generated Password: " + password;
        }
    </script>

</body>
</html>
